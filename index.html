<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#06111f" />
  <title>UFN Crew Deployment | Interstellar Deployment Planner</title>
  <link rel="icon" href="assets/idp-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="idp-brand" href="./" aria-label="Interstellar Deployment Planner home">
        <img class="idp-banner" src="assets/idp-banner.png" alt="Interstellar Deployment Planner">
      </a>
      <div class="client-lockup">
        <div class="client-copy">
          <span>Official deployment services provider to the</span>
          <strong>United Federated Navy</strong>
        </div>
        <div class="ufn-mark"><img src="assets/ufn-logo.webp" alt="United Federated Navy"></div>
      </div>
    </header>
    <div id="topActions" class="top-actions masthead-tools"></div>

    <main id="main" class="main">
      <section class="loading-card">
        <div class="scanner"></div>
        <h1>Loading crew planner…</h1>
        <p>Establishing UFN deployment services.</p>
      </section>
    </main>

    <footer class="footer">
      <span>United Federated Navy</span>
      <span>•</span>
      <span>Crew optimisation services by Interstellar Deployment Planner</span>
    </footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
